<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Uji 6 - GET Data Tidak Ditemukan (404)</title>
<style>
  body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:#0f172a; color:#e2e8f0; }
  .wrap { padding:24px; }
  .badge { display:inline-block; padding:6px 12px; border-radius:6px; font-weight:700; background:#b91c1c; color:white; margin-right:8px; }
  .method { display:inline-block; padding:6px 10px; border-radius:6px; background:#334155; font-weight:700; }
  h1 { font-size:20px; margin:16px 0 8px; }
  .url { font-family: Consolas, monospace; background:#1e293b; padding:10px 12px; border-radius:8px; margin:12px 0; word-break:break-all; }
  .label { color:#94a3b8; font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; }
  pre.box { background:#020617; border:1px solid #334155; border-radius:8px; padding:14px; white-space:pre-wrap; word-break:break-word; font-family: Consolas, monospace; font-size:13px; line-height:1.45; }
  .meta { color:#94a3b8; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta">Pengujian Manual REST API Mahasiswa — Thunder Client Style Capture</div>
  <h1>Skenario 6: GET Data Tidak Ditemukan (404)</h1>
  <div>
    <span class="method">GET</span>
    <span class="badge">HTTP 404</span>
  </div>
  <div class="url">http://127.0.0.1:8000/api/mahasiswa/99999</div>
  
  <div class="label">Response JSON</div>
  <pre class="box">{
    "message":  "Data tidak ditemukan."
}</pre>
</div>
</body>
</html>
